name: CI

# Bei jedem Push und Pull Request: Tests, dann das Image bauen.
# Veröffentlicht wird nicht bei Pull Requests: main ergibt den Tag "edge",
# ein Versions-Tag wie v1.2.3 ergibt 1.2.3, 1.2 und latest.
#
# Zusammenführen und Veröffentlichen sind getrennt:
#
#   - Ein Pull Request von Dependabot, der grün ist, wird zusammengeführt.
#   - Einmal in der Nacht entsteht aus allem, was seit dem letzten Tag auf
#     main dazukam, ein Release mit der nächsten Patch-Version: Tests, Image
#     1.2.4, 1.2 und latest, dann Tag und GitHub-Release. Gibt es nichts
#     Neues, endet der Durchlauf nach dem ersten Job.
#
# Was ein Workflow mit dem GITHUB_TOKEN auslöst (zusammenführen, Tag anlegen),
# startet keinen weiteren Workflow. Der Release-Durchlauf baut deshalb das
# Image selbst, statt auf einen Durchlauf für den neuen Tag zu warten.

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
  # Das nächtliche Release, in UTC. Die krumme Minute meidet den Andrang zur
  # vollen Stunde, zu der GitHub geplante Durchläufe oft verspätet startet.
  schedule:
    - cron: "17 2 * * *"
  # Von Hand: Actions -> CI -> Run workflow.
  workflow_dispatch:
    inputs:
      release:
        description: Auf main ein Release anlegen, wenn es seit dem letzten Tag Neues gibt
        type: boolean
        default: false
      bump:
        description: Welche Stelle der Version das Release erhöht
        type: choice
        options: [patch, minor, major]
        default: patch

# Ohne ausdrückliche Angabe darf ein Job nur lesen.
permissions:
  contents: read

# Mit ausdrücklich gewählter bash laufen die Skripte mit "pipefail": Schlägt
# in einer Pipe ein Befehl fehl, bricht der Schritt ab, statt weiterzurechnen.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  # Ein neuer Push ersetzt den laufenden Durchlauf eines Pull Requests.
  # Veröffentlichungen laufen immer zu Ende.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Versionen sind durchgängig festgelegt, damit sich nichts unbemerkt ändert:
#   - Runner: ein konkretes Ubuntu statt "ubuntu-latest" (von Hand anheben)
#   - Actions: auf einen Commit, die Version steht als Kommentar dahinter (Dependabot)
#   - Go: genau die Version des Basis-Images im Dockerfile (Dependabot)
#   - buildx und BuildKit: unten im Image-Job (von Hand anheben)

jobs:
  # Entscheidet, ob dieser Durchlauf ein Release ist und welche Version es
  # bekommt. Ein Release-Durchlauf ohne neue Commits endet hier.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      version: ${{ steps.plan.outputs.version }} # v1.2.3, leer = kein Release
    env:
      RELEASE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.release)) }}
      BUMP: ${{ inputs.bump }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RELEASE == 'true'
        with:
          fetch-depth: 0 # mit allen Tags
          persist-credentials: false

      - name: Release und Version bestimmen
        id: plan
        run: |
          if [ "$RELEASE" != true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last=$({ git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | head -n 1)
          if [ -z "$last" ]; then
            next=v1.0.0 # das erste Release
          elif [ "$(git rev-list -n 1 "$last")" = "$GITHUB_SHA" ]; then
            echo "::notice::Seit $last gibt es nichts Neues auf main, kein Release"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *) patch=$((patch + 1)) ;;
            esac
            next="v$major.$minor.$patch"
          fi
          echo "::notice::Release $next"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go-Version und Build-Tags stehen nur im Dockerfile. So laufen die
      # Tests mit genau dem, womit das Image gebaut wird, bis zum Patch-Stand.
      - name: Go-Version und Build-Tags aus dem Dockerfile lesen
        id: build
        run: |
          go=$(sed -n 's/^FROM .*golang:\([0-9.]*\)-alpine.*/\1/p' Dockerfile)
          tags=$(sed -n 's/^ARG GO_TAGS=//p' Dockerfile)
          if [ -z "$go" ] || [ -z "$tags" ]; then
            echo "::error file=Dockerfile::Go-Version oder GO_TAGS im Dockerfile nicht gefunden"
            exit 1
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.build.outputs.go }}

      - name: Formatierung
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Nicht mit gofmt formatiert: $unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests mit Race-Detector
        run: go test -race ./...

      - name: Tests wie im Image (ohne cgo, mit den Build-Tags)
        env:
          CGO_ENABLED: "0"
          GO_TAGS: ${{ steps.build.outputs.tags }}
        run: go test -tags "$GO_TAGS" ./...

  image:
    name: Image
    needs: [plan, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # Image nach ghcr.io schieben
    env:
      # Der Build-Bericht in der Zusammenfassung reicht, das Archiv dazu nicht.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ohne Angaben käme buildx aus dem Runner-Image und BuildKit vom
      # beweglichen Tag "buildx-stable-1". Dependabot kennt diese beiden
      # Stellen nicht, sie werden von Hand angehoben. Beim Anheben von BuildKit
      # gehört der Digest dazu:
      #   docker buildx imagetools inspect moby/buildkit:<version>
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.2
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Image-Tags bestimmen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Die Version kommt bei einem Release-Durchlauf aus dem Plan
          # (value), bei einem von Hand geschobenen Tag aus dem Tag selbst.
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.version }}

      # Die Version landet im Binary: "rarebirdalert version" und die Metrik
      # rarebirdalert_build_info zeigen sie an.
      - name: Version bestimmen
        id: version
        env:
          PLANNED: ${{ needs.plan.outputs.version }}
          TAGGED: ${{ steps.meta.outputs.version }}
        run: |
          if [ -n "$PLANNED" ]; then
            version=${PLANNED#v}
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$TAGGED
          else
            version="edge-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Image für amd64 bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          provenance: false
          tags: rarebirdalert:ci
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha

      - name: Image starten und Größe prüfen
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # Das Image soll schlank bleiben. Wer diese Grenze reißt, hat
          # vermutlich eine schwere Abhängigkeit eingeführt.
          BUDGET_BYTES: "10000000"
        run: |
          reported=$(docker run --rm rarebirdalert:ci version)
          if [ "$reported" != "$VERSION" ]; then
            echo "::error::Das Image meldet Version '$reported', erwartet war '$VERSION'"
            exit 1
          fi

          # Größe des entpackten Dateisystems, unabhängig davon, wie Docker
          # die Schichten speichert.
          container=$(docker create rarebirdalert:ci)
          bytes=$(docker export "$container" | wc -c)
          docker rm "$container" > /dev/null

          megabytes() { awk -v bytes="$1" 'BEGIN { printf "%.2f MB", bytes / 1000000 }'; }
          {
            echo "### Image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` |"
            echo "| Größe (linux/amd64, entpackt) | $(megabytes "$bytes") |"
            echo "| Budget | $(megabytes "$BUDGET_BYTES") |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$bytes" -gt "$BUDGET_BYTES" ]; then
            echo "::error::Das Image ist $(megabytes "$bytes") groß, das Budget liegt bei $(megabytes "$BUDGET_BYTES")"
            exit 1
          fi

      - name: Bei ghcr.io anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ohne QEMU: Die Build-Stage läuft nativ und cross-kompiliert, die
      # Zielstufe kopiert nur Dateien. Bei Pull Requests wird gebaut, aber
      # nichts veröffentlicht.
      - name: Image für amd64 und arm64 bauen und veröffentlichen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Das Label "source" verknüpft das Paket auf ghcr.io mit dem Repo.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Ein Pull Request von Dependabot, der Tests und Image-Build bestanden hat,
  # wird zusammengeführt. Veröffentlicht wird er mit dem nächsten Release.
  automerge:
    name: Dependabot zusammenführen
    needs: [test, image]
    # Nur, wenn Dependabot den Pull Request angelegt und auch den letzten
    # Stand geschoben hat. Hat jemand anderes etwas ergänzt, bleibt er offen.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # zusammenführen
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # --match-head-commit: zusammengeführt wird genau der geprüfte Stand.
      - name: Pull Request zusammenführen
        run: gh pr merge "$PR" --squash --match-head-commit "$HEAD_SHA"

  # Der Tag entsteht erst, wenn das Image veröffentlicht ist: Es gibt kein
  # Release ohne Image.
  release:
    name: Release
    needs: [plan, image]
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # Tag und Release anlegen
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Tag und Release anlegen
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
