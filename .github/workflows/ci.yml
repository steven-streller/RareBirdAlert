name: CI

# Bei jedem Push und Pull Request: Tests, dann das Image bauen.
# Veröffentlicht wird nicht bei Pull Requests: main ergibt die Tags "edge"
# und "sha-<Commit>", ein von Hand geschobener Versions-Tag wie v1.2.3 ergibt
# 1.2.3, 1.2 und latest.
#
# Zusammenführen und Veröffentlichen sind getrennt:
#
#   - Ein Pull Request von Dependabot, der grün ist, wird zusammengeführt.
#   - Einmal in der Nacht wird "edge" neu gebaut, wenn sich auf main seit dem
#     letzten Build etwas geändert hat, das ins Image eingeht. Sonst endet der
#     Durchlauf nach dem ersten Job.
#
# Was ein Workflow mit dem GITHUB_TOKEN zusammenführt, startet keinen
# Durchlauf für main. Deshalb der nächtliche Build.
#
# Wer das Image mit Digest betreibt (…:edge@sha256:…), bekommt von Renovate
# einen Pull Request, sobald "edge" auf ein neues Image zeigt.

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
  # Der nächtliche Build, in UTC. Die krumme Minute meidet den Andrang zur
  # vollen Stunde, zu der GitHub geplante Durchläufe oft verspätet startet.
  schedule:
    - cron: "17 2 * * *"
  # Von Hand: Actions -> CI -> Run workflow. Baut immer.
  workflow_dispatch:

# Ohne ausdrückliche Angabe darf ein Job nur lesen.
permissions:
  contents: read

# Mit ausdrücklich gewählter bash laufen die Skripte mit "pipefail": Schlägt
# in einer Pipe ein Befehl fehl, bricht der Schritt ab, statt weiterzurechnen.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  # Ein neuer Push ersetzt den laufenden Durchlauf eines Pull Requests.
  # Veröffentlichungen laufen immer zu Ende.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Versionen sind durchgängig festgelegt, damit sich nichts unbemerkt ändert:
#   - Runner: ein konkretes Ubuntu statt "ubuntu-latest" (von Hand anheben)
#   - Actions: auf einen Commit, die Version steht als Kommentar dahinter (Dependabot)
#   - Go: genau die Version des Basis-Images im Dockerfile (Dependabot)
#   - buildx und BuildKit: unten im Image-Job (von Hand anheben)

jobs:
  # Der nächtliche Durchlauf baut nur, wenn es etwas zu bauen gibt. Alle
  # anderen Durchläufe bauen immer.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # frühere Durchläufe nachschlagen
    outputs:
      run: ${{ steps.plan.outputs.run }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'schedule'
        with:
          fetch-depth: 0 # der Stand des letzten Builds muss dabei sein
          persist-credentials: false

      - name: Gibt es etwas zu bauen?
        id: plan
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Der Stand des letzten grünen Durchlaufs auf main. Der hat gebaut,
          # oder er hat aus demselben Grund wie hier nicht bauen müssen: Das
          # veröffentlichte Image entspricht in beiden Fällen diesem Stand.
          last=$(gh run list --workflow ci.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')

          # Was nicht ins Image eingeht, löst keinen Build aus. Die Liste
          # folgt der .dockerignore.
          unchanged=(. ':!README.md' ':!grafana' ':!config' ':!.github' ':!compose.yaml' ':!.gitignore' ':!.dockerignore')
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2> /dev/null && git diff --quiet "$last" "$GITHUB_SHA" -- "${unchanged[@]}"; then
            echo "::notice::Seit ${last::7} hat sich nichts geändert, das ins Image eingeht. Kein Build."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Neuer Build, letzter Stand: ${last:-keiner}"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go-Version und Build-Tags stehen nur im Dockerfile. So laufen die
      # Tests mit genau dem, womit das Image gebaut wird, bis zum Patch-Stand.
      - name: Go-Version und Build-Tags aus dem Dockerfile lesen
        id: build
        run: |
          go=$(sed -n 's/^FROM .*golang:\([0-9.]*\)-alpine.*/\1/p' Dockerfile)
          tags=$(sed -n 's/^ARG GO_TAGS=//p' Dockerfile)
          if [ -z "$go" ] || [ -z "$tags" ]; then
            echo "::error file=Dockerfile::Go-Version oder GO_TAGS im Dockerfile nicht gefunden"
            exit 1
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.build.outputs.go }}

      - name: Formatierung
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Nicht mit gofmt formatiert: $unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests mit Race-Detector
        run: go test -race ./...

      - name: Tests wie im Image (ohne cgo, mit den Build-Tags)
        env:
          CGO_ENABLED: "0"
          GO_TAGS: ${{ steps.build.outputs.tags }}
        run: go test -tags "$GO_TAGS" ./...

  image:
    name: Image
    needs: [plan, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # Image nach ghcr.io schieben
    env:
      # Der Build-Bericht in der Zusammenfassung reicht, das Archiv dazu nicht.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ohne Angaben käme buildx aus dem Runner-Image und BuildKit vom
      # beweglichen Tag "buildx-stable-1". Dependabot kennt diese beiden
      # Stellen nicht, sie werden von Hand angehoben. Beim Anheben von BuildKit
      # gehört der Digest dazu:
      #   docker buildx imagetools inspect moby/buildkit:<version>
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.2
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Image-Tags bestimmen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # "edge" wandert mit main. "sha-<Commit>" bleibt stehen: Daran ist
          # ablesbar, aus welchem Stand ein Image stammt, und ein älteres
          # Image lässt sich gezielt wieder einsetzen.
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Die Version landet im Binary: "rarebirdalert version" und die Metrik
      # rarebirdalert_build_info zeigen sie an.
      - name: Version bestimmen
        id: version
        env:
          TAGGED: ${{ steps.meta.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$TAGGED
          else
            version="edge-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Image für amd64 bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          provenance: false
          tags: rarebirdalert:ci
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha

      - name: Image starten und Größe prüfen
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # Das Image soll schlank bleiben. Wer diese Grenze reißt, hat
          # vermutlich eine schwere Abhängigkeit eingeführt.
          BUDGET_BYTES: "10000000"
        run: |
          reported=$(docker run --rm rarebirdalert:ci version)
          if [ "$reported" != "$VERSION" ]; then
            echo "::error::Das Image meldet Version '$reported', erwartet war '$VERSION'"
            exit 1
          fi

          # Größe des entpackten Dateisystems, unabhängig davon, wie Docker
          # die Schichten speichert.
          container=$(docker create rarebirdalert:ci)
          bytes=$(docker export "$container" | wc -c)
          docker rm "$container" > /dev/null

          megabytes() { awk -v bytes="$1" 'BEGIN { printf "%.2f MB", bytes / 1000000 }'; }
          {
            echo "### Image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` |"
            echo "| Größe (linux/amd64, entpackt) | $(megabytes "$bytes") |"
            echo "| Budget | $(megabytes "$BUDGET_BYTES") |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$bytes" -gt "$BUDGET_BYTES" ]; then
            echo "::error::Das Image ist $(megabytes "$bytes") groß, das Budget liegt bei $(megabytes "$BUDGET_BYTES")"
            exit 1
          fi

      - name: Bei ghcr.io anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ohne QEMU: Die Build-Stage läuft nativ und cross-kompiliert, die
      # Zielstufe kopiert nur Dateien. Bei Pull Requests wird gebaut, aber
      # nichts veröffentlicht.
      - name: Image für amd64 und arm64 bauen und veröffentlichen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Das Label "source" verknüpft das Paket auf ghcr.io mit dem Repo.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Ein Pull Request von Dependabot, der Tests und Image-Build bestanden hat,
  # wird zusammengeführt. Veröffentlicht wird er mit dem nächtlichen Build.
  automerge:
    name: Dependabot zusammenführen
    needs: [test, image]
    # Nur, wenn Dependabot den Pull Request angelegt und auch den letzten
    # Stand geschoben hat. Hat jemand anderes etwas ergänzt, bleibt er offen.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # zusammenführen
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # --match-head-commit: zusammengeführt wird genau der geprüfte Stand.
      - name: Pull Request zusammenführen
        run: gh pr merge "$PR" --squash --match-head-commit "$HEAD_SHA"
