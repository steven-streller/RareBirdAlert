name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff SARIF report
        if: always()
        run: ruff check . --output-format=sarif > ruff-results.sarif

      - name: Upload Ruff scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: ruff-results.sarif
          category: ruff

      - name: Pytest with coverage
        run: pytest -v --cov=app --cov-report=term-missing

  e2e:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-e2e.txt

      - name: Install dependencies
        run: pip install -r requirements-e2e.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run E2E tests
        run: pytest e2e/ -v

  docker-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true

      - name: Upload Hadolint scan results
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint

      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy dependency scan results
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: rarebirdalert:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rarebirdalert:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy image scan results
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Fail on critical vulnerabilities with a fix available
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rarebirdalert:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
